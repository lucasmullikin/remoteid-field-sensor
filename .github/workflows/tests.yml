name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package declares; 3.12 is the Ubuntu 24.04
        # ARM64 target the sensor actually runs on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Verify the record path end to end with no radio
        run: |
          python -m remoteid_sensor.cli --store /tmp/ci.jsonl selftest
          python -m remoteid_sensor.cli --store /tmp/ci.jsonl verify

      - name: Confirm the package imports without capture dependencies
        # The decode and record path must work on a machine with no radio
        # stack. If this breaks, a contributor without hardware is locked out.
        run: python -c "import remoteid_sensor.receivers.wifi, remoteid_sensor.receivers.bluetooth_lr"
